<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EduSphere</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #ffffff;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;

            color: #222;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 14px;

            font-weight: 600;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102, 126, 234, 0.12);
        }

        .options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #555;

            margin: 0;
        }

        .remember input {
            width: 16px;
            height: 16px;
        }

        .forgot {
            color: #667eea;

            text-decoration: none;

            font-weight: 600;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        #loginMessage {
            min-height: 22px;

            text-align: center;

            margin-bottom: 15px;

            font-size: 14px;

            font-weight: 600;
        }

        #loginMessage.error {
            color: #dc3545;
        }

        #loginMessage.success {
            color: #198754;
        }

        #loginButton {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        #loginButton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(102, 126, 234, 0.3);
        }

        #loginButton:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }

        .back-home {
            text-align: center;

            margin-top: 25px;
        }

        .back-home a {
            color: #667eea;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        .demo-login {
            margin-top: 25px;

            padding: 15px;

            background: #f6f7fb;

            border-radius: 12px;

            font-size: 12px;

            color: #555;
        }

        .demo-login h3 {
            font-size: 13px;

            color: #333;

            margin-bottom: 8px;
        }

        .demo-login p {
            margin: 4px 0;
        }

        .footer {
            text-align: center;

            color: white;

            font-size: 12px;

            margin-top: 18px;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            ES
        </div>


        <h1>
            Welcome to EduSphere
        </h1>


        <p class="subtitle">
            Admin Login
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot Password?
                </a>

            </div>


            <div id="loginMessage"></div>


            <button
                type="submit"
                id="loginButton"
            >
                Sign In to EduSphere
            </button>

        </form>


        <!-- ADMIN LOGIN DETAILS -->

        <div class="demo-login">

            <h3>
                Admin Login Details
            </h3>

            <p>
                <strong>Email:</strong>
                admin@edusphere.com
            </p>

            <p>
                <strong>Password:</strong>
                admin123
            </p>

        </div>


        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <div class="footer">

        © 2026 EduSphere. All Rights Reserved.

    </div>

</div>


<!-- =========================
     ADMIN LOGIN JAVASCRIPT
========================= -->

<script>

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    const rememberMe =
        document.getElementById("rememberMe");

    const forgotPassword =
        document.getElementById("forgotPassword");


    /* =========================
       ADMIN LOGIN
    ========================= */

    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value.trim();


            loginMessage.textContent = "";

            loginMessage.className = "";


            /* EMPTY CHECK */

            if (!email || !password) {

                loginMessage.textContent =
                    "Please enter your email and password.";

                loginMessage.classList.add("error");

                return;
            }


            /* ADMIN CHECK */

            if (
                email === "admin@edusphere.com" &&
                password === "admin123"
            ) {


                /* SAVE LOGIN */

                localStorage.setItem(
                    "edusphereLoggedIn",
                    "true"
                );


                /* SAVE ADMIN */

                localStorage.setItem(
                    "edusphereUser",
                    JSON.stringify({

                        id: 1,

                        name: "EduSphere Admin",

                        email: "admin@edusphere.com",

                        role: "admin"

                    })
                );


                /* REMEMBER ME */

                if (rememberMe.checked) {

                    localStorage.setItem(
                        "edusphereRemember",
                        "true"
                    );

                }
                else {

                    localStorage.removeItem(
                        "edusphereRemember"
                    );

                }


                /* SUCCESS */

                loginMessage.textContent =
                    "Login successful! Redirecting...";

                loginMessage.classList.add("success");


                loginButton.disabled = true;

                loginButton.textContent =
                    "Opening Dashboard...";


                /* REDIRECT */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );

            }


            /* INVALID */

            else {

                loginMessage.textContent =
                    "Invalid admin email or password.";

                loginMessage.classList.add("error");


                passwordInput.value = "";

                passwordInput.focus();


                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In to EduSphere";

            }

        }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotPassword.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            loginMessage.textContent =
                "Please contact the administrator to reset your password.";

            loginMessage.className = "error";

        }
    );


    /* =========================
       REMEMBERED ADMIN
    ========================= */

    window.addEventListener(
        "load",
        function() {

            const remembered =
                localStorage.getItem(
                    "edusphereRemember"
                );


            const savedUser =
                localStorage.getItem(
                    "edusphereUser"
                );


            if (
                remembered === "true" &&
                savedUser
            ) {

                try {

                    const user =
                        JSON.parse(savedUser);


                    if (
                        user.role === "admin"
                    ) {

                        emailInput.value =
                            user.email;

                        rememberMe.checked =
                            true;

                    }

                }
                catch(error) {

                    localStorage.removeItem(
                        "edusphereUser"
                    );

                }

            }

        }
    );

</script>

</body>

</html>
